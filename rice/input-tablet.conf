# OverOS input profile — tablet/touchscreen
# Declarative policy; session applies it after detecting real libinput devices.
[profile]
name=tablet
minimum_touch_target_dp=48
touch_enabled=auto
physical_keyboard_enabled=true
mouse_enabled=true
trackpad_enabled=true
show_virtual_keyboard=on_text_focus
virtual_keyboard_toggle=system-panel
virtual_keyboard_layout=pt-BR-abnt2
virtual_keyboard_backend=wayland-authorized
password_suggestions=false
store_typed_text=false
