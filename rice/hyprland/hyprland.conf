# OverOS — Hyprland session starter
# Experimental configuration. Hardware-specific values must be validated on the target tablet.

$mod = SUPER
monitor = , preferred, auto, 1

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(70d6d0ee)
    col.inactive_border = rgba(263748aa)
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 0.98
    inactive_opacity = 0.94
    blur { enabled = false }
    shadow { enabled = false }
}

animations {
    enabled = true
    bezier = overos, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 3, overos, popin 85%
    animation = windowsOut, 1, 2, overos, popin 85%
    animation = border, 1, 3, overos
    animation = fade, 1, 3, overos
    animation = workspaces, 1, 3, overos, slide
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad { natural_scroll = true; tap-to-click = true }
}

# Load target-specific input settings only after the touchscreen is identified.
# source = ~/.config/hypr/input-tablet.conf

$terminal = foot
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, RETURN, exec, $terminal
bind = $mod, F, fullscreen
bind = $mod, SPACE, togglefloating
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3

# Astal shell launcher will be enabled after its runtime is packaged.
# exec-once = overos-shell

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
