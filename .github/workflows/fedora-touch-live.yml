name: Build Fedora Touch Live ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "fedora/**"
      - "scripts/**"
      - ".github/workflows/fedora-touch-live.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM (/dev/kvm) is unavailable on this runner."
            exit 1
          fi

      - name: Build ISO with checkpointed AI repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-with-ai-repair.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: overos-fedora-live-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7

      - name: Upload build and repair history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overos-build-diagnostics
          path: |
            out/*.log
            out/diagnostics/**
            out/repair-history.txt
          if-no-files-found: ignore
          retention-days: 7
