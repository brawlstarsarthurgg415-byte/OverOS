name: Build Fedora Touch Live ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "fedora/**"
      - ".github/workflows/fedora-touch-live.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build live ISO in Fedora container
        run: |
          mkdir -p "$PWD/out"
          docker run --privileged --rm \
            -v "$PWD:/work" -w /work \
            fedora:latest bash -euxo pipefail -c '
              dnf -y install lorax-lmc-novirt pykickstart anaconda-tui anaconda-core \
                lorax lsof squashfs-tools xorriso grub2-efi-x64 shim-x64
              livemedia-creator \
                --make-iso \
                --no-virt \
                --ks fedora/touch-live.ks \
                --project "Fedora Touch Live" \
                --releasever 45 \
                --resultdir /work/out \
                --volid FEDORA_TOUCH
              ls -lh /work/out
            '
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-touch-live-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7
