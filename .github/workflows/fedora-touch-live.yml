name: Build Fedora Touch Live ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "fedora/**"
      - ".github/workflows/fedora-touch-live.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM (/dev/kvm) is unavailable on this runner; refusing an unsafe no-virt build."
            exit 1
          fi
      - name: Build live ISO in an isolated Fedora VM
        run: |
          docker run --rm \
            --device /dev/kvm \
            --cap-add SYS_ADMIN \
            --security-opt label=disable \
            -v "$PWD:/work" -w /work \
            fedora:latest bash -euxo pipefail -c '
              dnf -y install lorax-lmc-novirt pykickstart anaconda-tui anaconda-core \
                lorax lsof squashfs-tools xorriso grub2-efi-x64 shim-x64
              livemedia-creator \
                --make-iso \
                --virt \
                --ks fedora/touch-live.ks \
                --project "Fedora Touch Live" \
                --releasever 45 \
                --resultdir /work/out \
                --volid FEDORA_TOUCH
              ls -lh /work/out
            '
      - name: Install ISO editing utility
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso
      - name: Apply OverOS GRUB defaults
        run: |
          bash fedora/grub/patch-iso-grub.sh out
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-touch-live-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7
