name: Build Fedora Touch Live ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "fedora/**"
      - "scripts/**"
      - ".github/workflows/fedora-touch-live.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM (/dev/kvm) is unavailable on this runner; refusing an unsafe no-virt build."
            exit 1
          fi

      - name: Build ISO with bounded AI repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: bash scripts/build-with-ai-repair.sh

      - name: Install ISO editing utility
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Apply OverOS GRUB defaults
        run: bash fedora/grub/patch-iso-grub.sh out

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-touch-live-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-build-diagnostics
          path: out/*.log
          if-no-files-found: ignore
          retention-days: 7
