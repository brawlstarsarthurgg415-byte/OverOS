name: Build Fedora Touch Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/uefi-boot-and-build-cache
    paths:
      - "fedora/**"
      - "scripts/**"
      - ".github/workflows/fedora-touch-live.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare cache directories
        run: mkdir -p downloads cache/dnf

      - name: Cache Fedora installer and DNF packages
        uses: actions/cache@v4
        with:
          path: |
            downloads/Fedora-Everything-netinst.iso
            cache/dnf
          key: overos-fedora45-netinst-1.4-dnf-${{ runner.os }}-${{ hashFiles('fedora/touch-live.ks') }}
          restore-keys: |
            overos-fedora45-netinst-1.4-dnf-${{ runner.os }}-

      - name: Check KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM (/dev/kvm) is unavailable on this runner."
            exit 1
          fi

      - name: Build ISO with checkpointed AI repair
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-with-ai-repair.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: overos-fedora-live-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7

      - name: Upload build and repair history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overos-build-diagnostics
          path: |
            out/*.log
            out/diagnostics/**
            out/repair-history.txt
          if-no-files-found: ignore
          retention-days: 7
