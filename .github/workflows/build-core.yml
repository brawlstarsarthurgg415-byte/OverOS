name: Build OverOS native core

on:
  push:
    branches: [overos-custom-core]
    paths:
      - "core/**"
      - "rice/**"
      - "scripts/build-core.sh"
      - "scripts/check-build-host.sh"
      - "scripts/stage-rootfs.sh"
      - "scripts/build-bootable-img.sh"
      - "scripts/test-rootfs-staging.sh"
      - "scripts/test-touch-assets.sh"
      - "scripts/check-touchscreen.sh"
      - "scripts/check-secure-boot-tools.sh"
      - ".github/workflows/build-core.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libgtk-4-dev debootstrap grub-pc-bin grub-efi-amd64-bin dosfstools parted e2fsprogs mtools qemu-system-x86
      - name: Check build host prerequisites
        run: bash scripts/check-build-host.sh
      - name: Validate touch and virtual keyboard assets
        run: bash scripts/test-touch-assets.sh
      - name: Validate touchscreen diagnostic script
        run: bash -n scripts/check-touchscreen.sh
      - name: Inventory Secure Boot development tools (read-only)
        run: bash scripts/check-secure-boot-tools.sh
      - name: Configure and compile
        run: bash scripts/build-core.sh
      - name: Assemble development rootfs staging tree
        run: bash scripts/stage-rootfs.sh
      - name: Verify staged rootfs layout
        run: bash scripts/test-rootfs-staging.sh
      - name: Build bootable raw image (BIOS + UEFI)
        run: sudo bash scripts/build-bootable-img.sh
      - name: Verify generated image exists and is non-empty
        run: test -s out/OverOS-Custom.img
      - name: Smoke-test boot in QEMU
        shell: bash
        run: |
          set +e
          timeout 90s qemu-system-x86_64 -m 1024 -drive file=out/OverOS-Custom.img,format=raw -nographic -monitor none -serial stdio -no-reboot > out/boot-test.log 2>&1
          status=$?
          set -e
          if ! grep -q 'OverOS Custom' out/boot-test.log; then
            tail -n 120 out/boot-test.log
            echo 'A imagem nao chegou ao console do OverOS dentro do teste QEMU.' >&2
            exit 1
          fi
          echo 'Imagem inicializavel: banner OverOS Custom detectado no console serial.'
      - name: Publish raw IMG release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: overos-custom-dev-${{ github.run_number }}
          name: OverOS Custom Dev ${{ github.run_number }}
          body: |
            Imagem raw inicializavel do OverOS Custom para testes.
            Testada por smoke test no QEMU; ainda e uma imagem de desenvolvimento, nao a distribuicao independente final.
            Inclui kernel/base Debian temporarios, componentes nativos OverOS, boot BIOS e UEFI. Secure Boot nao foi validado.
          prerelease: true
          files: out/OverOS-Custom.img
          fail_on_unmatched_files: true
      - name: Upload bootable image artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-Custom-img-${{ github.sha }}
          path: out/OverOS-Custom.img
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-native-core-${{ github.sha }}
          path: out/core-build/overos-*
          if-no-files-found: error
          retention-days: 14

      - name: Upload rootfs staging tree (not bootable)
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-rootfs-staging-${{ github.sha }}
          path: out/rootfs-staging/
          if-no-files-found: error
          retention-days: 14
