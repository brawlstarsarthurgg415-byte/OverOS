name: Build OverOS native core

on:
  push:
    branches: [overos-custom-core]
    paths:
      - "core/**"
      - "rice/**"
      - "overvault/**"
      - "buildroot/**"
      - "board/**"
      - "scripts/build-core.sh"
      - "scripts/check-build-host.sh"
      - "scripts/stage-rootfs.sh"
      - "scripts/build-bootable-img.sh"
      - "scripts/build-buildroot-rootfs.sh"
      - "scripts/test-rootfs-staging.sh"
      - "scripts/test-touch-assets.sh"
      - "scripts/test-specman.sh"
      - "scripts/check-touchscreen.sh"
      - "scripts/check-secure-boot-tools.sh"
      - ".github/workflows/build-core.yml"
  workflow_dispatch:

# Queue new builds instead of cancelling an in-progress image build.
concurrency:
  group: overos-custom-core-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache cmake libgtk-4-dev curl wget perl python3 meson ninja-build pkg-config cpio rsync bc bison flex file unzip libncurses-dev grub-pc-bin grub-efi-amd64-bin dosfstools parted e2fsprogs mtools qemu-system-x86 ovmf zstd
      - name: Restore Buildroot source and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            out/buildroot-dl
            out/buildroot-ccache
            out/buildroot-2025.02.tar.xz
          key: overos-buildroot-${{ runner.os }}-2025.02-${{ hashFiles('buildroot/overos_x86_64_defconfig') }}
          restore-keys: |
            overos-buildroot-${{ runner.os }}-2025.02-
      - name: Validate Buildroot C++ and cache configuration
        run: |
          grep -qx 'BR2_TOOLCHAIN_BUILDROOT_CXX=y' buildroot/overos_x86_64_defconfig
          grep -qx 'BR2_CCACHE=y' buildroot/overos_x86_64_defconfig
          bash -n scripts/build-buildroot-rootfs.sh scripts/build-bootable-img.sh
      - name: Check build host prerequisites
        run: bash scripts/check-build-host.sh
      - name: Validate touch and virtual keyboard assets
        run: bash scripts/test-touch-assets.sh
      - name: Validate Specman package manager
        run: bash scripts/test-specman.sh
      - name: Validate shell scripts
        run: |
          sh -n board/overos/rootfs-overlay/usr/bin/specman
          sh -n board/overos/rootfs-overlay/usr/bin/overos-gui
          bash -n scripts/build-buildroot-rootfs.sh scripts/build-bootable-img.sh overvault/tools/build-fastfetch-package.sh overvault/tools/publish-repo.sh
      - name: Validate touchscreen diagnostic script
        run: bash -n scripts/check-touchscreen.sh
      - name: Inventory Secure Boot development tools (read-only)
        run: bash scripts/check-secure-boot-tools.sh
      - name: Configure and compile
        run: bash scripts/build-core.sh
      - name: Assemble development rootfs staging tree
        run: bash scripts/stage-rootfs.sh
      - name: Verify staged rootfs layout
        run: bash scripts/test-rootfs-staging.sh
      - name: Build independent Buildroot rootfs and Linux kernel
        run: bash scripts/build-buildroot-rootfs.sh
      - name: Verify first OverVault package
        run: test -s out/overvault/x86_64/fastfetch-2.53.0-1-x86_64.pkg.tar.zst
      - name: Upload OverVault package artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverVault-x86_64-fastfetch-${{ github.sha }}
          path: out/overvault/x86_64/fastfetch-2.53.0-1-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
      - name: Build bootable raw image (BIOS + UEFI)
        run: sudo bash scripts/build-bootable-img.sh
      - name: Verify generated image exists and is non-empty
        run: test -s out/OverOS-Custom.img
      - name: Smoke-test boot in QEMU
        shell: bash
        run: |
          set +e
          timeout 90s qemu-system-x86_64 -m 1024 -drive file=out/OverOS-Custom.img,format=raw -nographic -monitor none -serial stdio -no-reboot > out/boot-test.log 2>&1
          status=$?
          set -e
          if ! grep -q 'OverOS Custom' out/boot-test.log; then
            tail -n 120 out/boot-test.log
            echo 'A imagem nao chegou ao console do OverOS dentro do teste QEMU.' >&2
            exit 1
          fi
          if ! grep -Eq 'login:' out/boot-test.log; then
            tail -n 120 out/boot-test.log
            echo 'A imagem mostrou o banner, mas nao chegou ao prompt de login serial.' >&2
            exit 1
          fi
          echo 'BIOS: banner OverOS Custom e prompt de login detectados.'
          set +e
          timeout 90s qemu-system-x86_64 -m 1024 -bios /usr/share/OVMF/OVMF_CODE.fd -drive file=out/OverOS-Custom.img,format=raw -nographic -monitor none -serial stdio -no-reboot > out/boot-test-uefi.log 2>&1
          status=$?
          set -e
          if ! grep -q 'OverOS Custom' out/boot-test-uefi.log; then
            tail -n 120 out/boot-test-uefi.log
            echo 'UEFI: a imagem nao chegou ao banner OverOS Custom no QEMU.' >&2
            exit 1
          fi
          if ! grep -Eq 'login:' out/boot-test-uefi.log; then
            tail -n 120 out/boot-test-uefi.log
            echo 'UEFI: a imagem mostrou o banner, mas nao chegou ao prompt de login serial.' >&2
            exit 1
          fi
          echo 'UEFI: banner OverOS Custom e prompt de login detectados.'
      - name: Publish raw IMG release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: overos-custom-dev-${{ github.run_number }}
          name: OverOS Custom Dev ${{ github.run_number }}
          body: |
            Imagem raw inicializavel do OverOS Custom para testes.
            Testada por smoke test no QEMU; ainda e uma imagem de desenvolvimento, nao a distribuicao independente final.
            Inclui rootfs BusyBox/musl, kernel Linux, Pacman/libalpm em compilacao para musl, Specman MVP, rede e desktop leve construidos com Buildroot. Repositorio assinado, Secure Boot e compatibilidade com hardware real ainda nao foram validados.
          prerelease: true
          files: out/OverOS-Custom.img
          fail_on_unmatched_files: true
      - name: Upload bootable image artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-Custom-img-${{ github.sha }}
          path: out/OverOS-Custom.img
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-native-core-${{ github.sha }}
          path: out/core-build/overos-*
          if-no-files-found: error
          retention-days: 14

      - name: Upload rootfs staging tree (not bootable)
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-rootfs-staging-${{ github.sha }}
          path: out/rootfs-staging/
          if-no-files-found: error
          retention-days: 14
