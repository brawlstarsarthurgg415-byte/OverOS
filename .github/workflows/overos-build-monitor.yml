name: OverOS Build Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: overos-build-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest build and notify only on success
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "fedora-touch-live.yml";
            const account = "brawlstarsarthurgg415-byte";
            const maxRunAttempts = 3;

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, branch: "main", per_page: 10
            });

            const runs = data.workflow_runs || [];
            if (!runs.length) {
              core.info("No OverOS build has run on main yet.");
              return;
            }

            const run = runs[0];
            core.info(`Latest build: #${run.id}; status=${run.status}; conclusion=${run.conclusion}; attempt=${run.run_attempt}`);

            if (run.status !== "completed") {
              core.info("Build is still running. Staying silent.");
              return;
            }

            if (run.conclusion === "success") {
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100
              });
              const iso = (artifacts.artifacts || []).find(
                a => a.name === "overos-fedora-live-iso" && !a.expired
              );

              if (!iso) {
                core.warning("Build reported success, but the ISO artifact is missing or expired. No success notification sent.");
                return;
              }

              const title = `OverOS ISO compilada com sucesso — execução ${run.id}`;
              const { data: issues } = await github.rest.issues.listForRepo({
                owner, repo, state: "all", per_page: 100
              });
              const alreadyNotified = issues.some(i => !i.pull_request && i.title === title);

              if (!alreadyNotified) {
                const runUrl = run.html_url;
                const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts`;
                await github.rest.issues.create({
                  owner, repo,
                  title,
                  assignees: [account],
                  body: `@ ${account} A compilação do OverOS terminou com sucesso e o artefato ISO foi encontrado.\n\n- [Ver execução da compilação](${runUrl})\n- [Abrir artefatos e baixar a ISO](${artifactUrl})\n\nExecução: ${run.id} (tentativa ${run.run_attempt}).`
                });
                core.info("Success notification issue created and assigned.");
              } else {
                core.info("This successful run was already reported.");
              }
              return;
            }

            if (run.conclusion === "failure" && run.run_attempt < maxRunAttempts) {
              core.warning(`Build failed. Requesting retry ${run.run_attempt + 1}/${maxRunAttempts}; no notification will be sent.`);
              await github.rest.actions.reRunFailedJobs({ owner, repo, run_id: run.id });
              return;
            }

            core.info(`Build ended with conclusion ${run.conclusion}. Retry limit reached or no automatic retry applies; staying silent.`);
