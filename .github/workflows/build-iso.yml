name: Build OverOS Arch ISO

on:
  push:
    branches: [daten-usb-astal]
    paths:
      - "iso/**"
      - "scripts/build-iso.sh"
      - ".github/workflows/build-iso.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overos-arch-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build Arch Linux ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        run: bash scripts/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-Arch-ISO-${{ github.sha }}
          path: out/iso/*.iso
          if-no-files-found: error
          retention-days: 14
