name: Build OverOS ISO

on:
  push:
    branches: [main]
    paths:
      - "iso/**"
      - "scripts/build-iso.sh"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build bootable Arch ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso git nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ISO
        run: bash scripts/build-iso.sh

      - name: Publish GitHub Release with ISO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: overos-build-${{ github.run_number }}
          name: OverOS Build ${{ github.run_number }}
          body: |
            Build automático do OverOS baseado em Arch Linux.
            ISO gerada pelo GitHub Actions. Versão de teste; compatibilidade de hardware ainda precisa ser verificada.
          prerelease: true
          generate_release_notes: true
          files: out/*.iso
          fail_on_unmatched_files: true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-ISO-${{ github.sha }}
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
