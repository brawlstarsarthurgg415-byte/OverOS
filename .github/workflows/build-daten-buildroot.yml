name: Build OverOS DATEN Buildroot core

on:
  push:
    branches: [daten-usb-astal]
    paths:
      - "buildroot/**"
      - "board/**"
      - "core/**"
      - "overvault/**"
      - "rice/**"
      - "scripts/build-buildroot-rootfs.sh"
      - ".github/workflows/build-daten-buildroot.yml"
  workflow_dispatch:

concurrency:
  group: overos-daten-buildroot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  buildroot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc g++ make cmake curl git perl python3 cpio rsync bc bison flex ccache meson ninja-build pkg-config file unzip wget patch gzip bzip2 xz-utils zstd libncurses-dev libelf-dev
      - name: Restore Buildroot downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            out/buildroot-dl
            out/buildroot-ccache
            out/buildroot-2025.02.tar.xz
          key: overos-daten-buildroot-${{ runner.os }}-2025.02-${{ hashFiles('buildroot/overos_x86_64_defconfig') }}
          restore-keys: |
            overos-daten-buildroot-${{ runner.os }}-2025.02-
      - name: Validate build scripts
        run: bash -n scripts/build-buildroot-rootfs.sh
      - name: Build independent Buildroot rootfs and kernel
        run: bash scripts/build-buildroot-rootfs.sh
      - name: Verify rootfs and kernel outputs
        run: |
          test -s out/overos-buildroot/rootfs.tar
          test -s out/overos-buildroot/bzImage
          file out/overos-buildroot/rootfs.tar out/overos-buildroot/bzImage
      - name: Upload Buildroot core (not a USB image)
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-DATEN-Buildroot-core-${{ github.sha }}
          path: |
            out/overos-buildroot/rootfs.tar
            out/overos-buildroot/bzImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
